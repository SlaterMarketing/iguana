{% load static %}<!doctype html>
<html lang="{{ lang|default:'en' }}">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Iguana Comedy{% endblock %}</title>
  <link rel="preload" href="{% static 'fonts/bebas-neue-latin-400-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <link rel="preload" href="{% static 'fonts/dm-sans-latin-wght-normal.woff2' %}" as="font" type="font/woff2" crossorigin>
  <style>
    /* Self-hosted fonts (backend/static/fonts); no Google Fonts request. */
    @font-face { font-family: "Bebas Neue"; src: url("{% static 'fonts/bebas-neue-latin-400-normal.woff2' %}") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: "Bebas Neue"; src: url("{% static 'fonts/bebas-neue-latin-ext-400-normal.woff2' %}") format("woff2"); font-weight: 400; font-display: block; unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    @font-face { font-family: "DM Sans"; src: url("{% static 'fonts/dm-sans-latin-wght-normal.woff2' %}") format("woff2"); font-weight: 100 1000; font-display: swap; unicode-range: U+0000-00FF,U+0131,U+0152-0153,U+02BB-02BC,U+02C6,U+02DA,U+02DC,U+0304,U+0308,U+0329,U+2000-206F,U+20AC,U+2122,U+2191,U+2193,U+2212,U+2215,U+FEFF,U+FFFD; }
    @font-face { font-family: "DM Sans"; src: url("{% static 'fonts/dm-sans-latin-ext-wght-normal.woff2' %}") format("woff2"); font-weight: 100 1000; font-display: swap; unicode-range: U+0100-02BA,U+02BD-02C5,U+02C7-02CC,U+02CE-02D7,U+02DD-02FF,U+0304,U+0308,U+0329,U+1D00-1DBF,U+1E00-1E9F,U+1EF2-1EFF,U+2020,U+20A0-20AB,U+20AD-20C0,U+2113,U+2C60-2C7F,U+A720-A7FF; }
    :root { --brand: #3f7d3e; --brand-hover: #2b5c2a; --brand-soft: #e6f0e4; --ink: #0a0a0a; --muted: #5b5b5b; --line: rgba(0,0,0,.1); --bg: #fafafa; --danger: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: {% if embedded %}transparent{% else %}var(--bg){% endif %}; }
    .wrap { max-width: 640px; margin: 0 auto; padding: {% if embedded %}4px 3px{% else %}48px 20px{% endif %}; }
    h1, h2 { font-family: "Bebas Neue", ui-sans-serif, system-ui, sans-serif; font-weight: 400; letter-spacing: .01em; line-height: 1.05; margin: 0; }
    h1 { font-size: clamp(2rem, 6vw, 2.75rem); }
    h2 { font-size: 1.6rem; }
    .muted { color: var(--muted); }
    .eyebrow { font-size: .7rem; font-weight: 600; letter-spacing: .35em; text-transform: uppercase; color: var(--muted); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
    .stack > * + * { margin-top: 16px; }
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 600 .75rem/1 "DM Sans", sans-serif; letter-spacing: .3em; text-transform: uppercase; padding: 18px 24px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--brand-hover); }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .error { color: var(--danger); font-size: .9rem; }
    .ok { background: var(--brand-soft); border-radius: 14px; padding: 12px 16px; font-size: .9rem; }
    label { display: grid; gap: 6px; font-size: .85rem; font-weight: 600; }
    input { font: inherit; font-weight: 400; padding: 12px 14px; border: 1px solid rgba(0,0,0,.2); border-radius: 12px; width: 100%; background: #fff; }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
    /* The floor console's nav, defined ONCE here because four templates carry it and four copies is how they
       drift. Pills are sized to their LABEL and wrap onto as many rows as they need: the first version gave
       each one `flex: 1 1 0` with a `min-width`, which forced the row wider than a 320px phone (20px of page
       overflow) and, worse, squeezed each pill narrower than its own uppercase text so "INVENTARIO" was
       clipped inside its own button at every width tested. Content-sized and wrapping cannot do either. */
    .floornav { display: flex; flex-wrap: wrap; gap: 8px; margin: 14px 0 4px; }
    .floornav a, .floornav button { flex: 0 0 auto; width: auto; min-height: 44px; display: inline-flex;
      align-items: center; justify-content: center; border: 1px solid var(--line); background: #fff;
      border-radius: 999px; padding: 0 16px; font: 700 .7rem/1 "DM Sans", sans-serif; letter-spacing: .1em;
      text-transform: uppercase; color: var(--muted); text-decoration: none; cursor: pointer;
      white-space: nowrap; }
    .floornav a:hover, .floornav button:hover { color: var(--ink); border-color: var(--ink); }
    .floornav a.on { background: var(--ink); color: #fff; border-color: var(--ink); }
    .floornav form { flex: 0 0 auto; margin: 0; }
    /* Every disclosure trigger on the floor console, in one place. A `summary` is 14px tall by default, which
       is a fine target for a mouse and a bad one for a thumb in a dark room: measured 250x14 for "Editar" and
       "Receta" at every width. `body:has(.floornav)` scopes this to the console rather than to the customer
       pages that share this base, because the checkout iframe's height is measured to the pixel and must not
       move. A browser without `:has()` simply keeps the old size; nothing breaks. */
    body:has(.floornav) details > summary { display: flex; align-items: center; min-height: 44px;
      padding: 4px 2px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <main class="wrap">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
