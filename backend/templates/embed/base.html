<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>{% block title %}Iguana Comedy{% endblock %}</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=DM+Sans:wght@400..700&display=swap" rel="stylesheet">
  <style>
    :root { --brand: #3f7d3e; --brand-hover: #2b5c2a; --brand-soft: #e6f0e4; --ink: #0a0a0a; --muted: #5b5b5b; --line: rgba(0,0,0,.1); --bg: #fafafa; --danger: #b42318; }
    * { box-sizing: border-box; }
    body { margin: 0; font-family: "DM Sans", ui-sans-serif, system-ui, sans-serif; color: var(--ink); background: {% if embedded %}transparent{% else %}var(--bg){% endif %}; }
    .wrap { max-width: 640px; margin: 0 auto; padding: {% if embedded %}28px 20px{% else %}48px 20px{% endif %}; }
    h1, h2 { font-family: "Bebas Neue", ui-sans-serif, system-ui, sans-serif; font-weight: 400; letter-spacing: .01em; line-height: 1.05; margin: 0; }
    h1 { font-size: clamp(2rem, 6vw, 2.75rem); }
    h2 { font-size: 1.6rem; }
    .muted { color: var(--muted); }
    .eyebrow { font-size: .7rem; font-weight: 600; letter-spacing: .35em; text-transform: uppercase; color: var(--muted); }
    .card { background: #fff; border: 1px solid var(--line); border-radius: 20px; padding: 20px; }
    .stack > * + * { margin-top: 16px; }
    .btn { display: inline-flex; justify-content: center; align-items: center; width: 100%; border: 0; border-radius: 999px; background: var(--ink); color: #fff; font: 600 .75rem/1 "DM Sans", sans-serif; letter-spacing: .3em; text-transform: uppercase; padding: 18px 24px; cursor: pointer; text-decoration: none; }
    .btn:hover { background: var(--brand-hover); }
    .btn[disabled] { opacity: .5; cursor: not-allowed; }
    .error { color: var(--danger); font-size: .9rem; }
    .ok { background: var(--brand-soft); border-radius: 14px; padding: 12px 16px; font-size: .9rem; }
    label { display: grid; gap: 6px; font-size: .85rem; font-weight: 600; }
    input { font: inherit; font-weight: 400; padding: 12px 14px; border: 1px solid rgba(0,0,0,.2); border-radius: 12px; width: 100%; background: #fff; }
    input:focus { outline: 2px solid var(--brand); outline-offset: 1px; }
  </style>
  {% block head %}{% endblock %}
</head>
<body>
  <main class="wrap">{% block content %}{% endblock %}</main>
  {% block scripts %}{% endblock %}
</body>
</html>
