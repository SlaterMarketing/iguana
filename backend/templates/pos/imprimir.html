<!doctype html>
<html lang="es"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>{{ job.title }}</title>
<style>
  /* 80mm of thermal paper is about 72mm printable; 42 monospace columns fit it at this size. */
  @page { size: 80mm auto; margin: 3mm; }
  body { margin: 0; font-family: "Courier New", ui-monospace, monospace; }
  pre { font-size: 11.5px; line-height: 1.3; margin: 0; white-space: pre; }
  .bar { font-family: system-ui, sans-serif; display: flex; gap: 8px; padding: 10px; background: #16233a; }
  .bar button, .bar a { font: 700 14px system-ui; padding: 12px 16px; border: 0; border-radius: 10px; background: #3f7d3e; color: #fff; text-decoration: none; cursor: pointer; }
  .bar a { background: #22324f; }
  @media print { .bar { display: none; } }
</style></head>
<body>
  <div class="bar"><button onclick="window.print()">Imprimir</button><a href="?done=1" onclick="window.close()">Listo</a></div>
  <pre>{% for line in job.lines %}{{ line }}
{% endfor %}</pre>
  {% if auto %}<script>window.addEventListener("load", function () { setTimeout(function () { window.print(); }, 250); });</script>{% endif %}
</body></html>
