---
# End-to-end mail health check for iguanacomedy.mx. Read-only apart from the test messages it sends.
#   ansible-playbook email_check.yml
#   ansible-playbook email_check.yml -e mail_test_recipient=someone@example.com
#
# Asserts on content, not just exit codes: DNS values, PTR forward-confirmation, the DKIM key published vs the
# key on disk, STARTTLS certificate name, inbound local delivery, outbound 250 acceptance, and the SPF/DKIM/DMARC
# verdicts returned by an external verifier (check-auth@verifier.port25.com replies to our inbox).

- hosts: web
  become: true
  vars:
    resolver: 8.8.8.8
  tasks:
    # ------------------------------------------------------------------ DNS
    - name: Look up public DNS
      command: dig +short {{ item.type }} {{ item.name }} @{{ resolver }}
      loop:
        - {key: mx, type: MX, name: "{{ mail_zone }}"}
        - {key: mail_a, type: A, name: "{{ mail_domain }}"}
        - {key: mail_aaaa, type: AAAA, name: "{{ mail_domain }}"}
        - {key: spf, type: TXT, name: "{{ mail_zone }}"}
        - {key: dkim, type: TXT, name: "mail._domainkey.{{ mail_zone }}"}
        - {key: dmarc, type: TXT, name: "_dmarc.{{ mail_zone }}"}
        - {key: ptr4, type: PTR, name: "{{ server_ipv4.split('.') | reverse | join('.') }}.in-addr.arpa"}
      register: dns
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Facts from DNS
      set_fact:
        dns_map: "{{ dict(dns.results | map(attribute='item.key') | zip(dns.results | map(attribute='stdout'))) }}"

    - name: PTR v6
      command: dig +short -x {{ server_ipv6 }} @{{ resolver }}
      register: ptr6
      changed_when: false
      delegate_to: localhost
      become: false

    - name: Published DKIM key matches the private key on the server
      command: opendkim-testkey -d {{ mail_zone }} -s mail -k /etc/opendkim/keys/{{ mail_zone }}/mail.private -vvv
      register: dkim_testkey
      changed_when: false
      failed_when: "'key OK' not in dkim_testkey.stderr + dkim_testkey.stdout"

    - name: Assert DNS records
      assert:
        that:
          - "('10 ' + mail_domain + '.') in dns_map.mx"
          - "dns_map.mail_a == server_ipv4"
          - "dns_map.mail_aaaa == server_ipv6"
          - "('ip4:' + server_ipv4) in dns_map.spf and ('ip6:' + server_ipv6) in dns_map.spf"
          - "'v=DKIM1' in dns_map.dkim"
          - "'v=DMARC1' in dns_map.dmarc and 'rua=' in dns_map.dmarc"
          - "dns_map.ptr4 == mail_domain + '.'"
          - "ptr6.stdout == mail_domain + '.'"
        fail_msg: "{{ dns_map | combine({'ptr6': ptr6.stdout}) | to_json }}"
        success_msg: "MX, mail A/AAAA, SPF, DKIM, DMARC(rua), PTR v4+v6 all correct"

    # --------------------------------------------------------------- server
    - name: Postfix and OpenDKIM running, config valid
      shell: systemctl is-active postfix opendkim && postfix check && postconf -h myhostname virtual_alias_domains mydestination
      register: svc
      changed_when: false
      failed_when: svc.rc != 0 or mail_zone in (svc.stdout_lines[-1] | replace(' ', '') | split(','))  # bare domain in mydestination = bounce loops

    - name: STARTTLS on port 25 presents the mail certificate
      shell: echo QUIT | timeout 20 openssl s_client -starttls smtp -connect {{ mail_domain }}:25 -servername {{ mail_domain }} 2>/dev/null | openssl x509 -noout -subject -ext subjectAltName
      register: starttls
      changed_when: false
      failed_when: mail_domain not in starttls.stdout

    - name: Queue before test
      command: postqueue -p
      register: queue_before
      changed_when: false

    # -------------------------------------------------------------- inbound
    - name: Inbound test message token
      set_fact: {probe: "inbound-{{ 999999 | random }}"}

    - name: Deliver to hello@ over SMTP on the public address (as an outside client would)
      shell: |
        python3 - <<'PY'
        import smtplib
        from email.message import EmailMessage
        m = EmailMessage()
        m['From'] = 'no-reply@{{ mail_zone }}'
        m['To'] = 'hello@{{ mail_zone }}'
        m['Subject'] = 'inbound check {{ probe }}'
        m['Message-Id'] = '<{{ probe }}@{{ mail_domain }}>'
        m.set_content('inbound delivery check')
        with smtplib.SMTP('{{ mail_domain }}', 25, timeout=30) as s:
            s.starttls()
            s.send_message(m)
        PY
      changed_when: true

    - name: Relay to an outside domain from an outside client is refused (not an open relay)
      shell: |
        python3 - <<'PY'
        import smtplib, sys
        try:
            with smtplib.SMTP('{{ server_ipv4 }}', 25, timeout=30, source_address=('{{ server_ipv4 }}', 0)) as s:
                s.ehlo('relay-test.invalid')
                code, _ = s.mail('someone@example.net')
                code, msg = s.rcpt('victim@example.com')
                print(code, msg.decode())
                sys.exit(0 if code >= 500 else 1)
        except smtplib.SMTPRecipientsRefused:
            sys.exit(0)
        PY
      register: relay
      changed_when: false

    - name: hello@ landed in the local inbox
      shell: grep -c "inbound check {{ probe }}" /var/mail/inbox
      register: inbound
      retries: 10
      delay: 3
      until: inbound.rc == 0
      changed_when: false

    # ------------------------------------------------------------- outbound
    - name: Send test mail via Django (real From identity)
      command: venv/bin/python manage.py send_test_email {{ mail_test_recipient }} check-auth@verifier.port25.com
      args: {chdir: "{{ app_dir }}/backend"}
      become: true
      become_user: "{{ deploy_user }}"
      register: sent

    - name: Remote servers accepted each test message (tracked by Message-ID, then queue ID)
      shell: |
        python3 - <<'PY'
        import re
        sent = """{{ sent.stdout }}"""
        log = open('/var/log/mail.log', errors='replace').read()
        for mid in re.findall(r'message_id=<([^>]+)>', sent):
            q = re.findall(r' ([0-9A-F]{8,}): message-id=<' + re.escape(mid) + '>', log)
            final = re.findall(r' ' + q[-1] + r': (to=<[^>]+>).*?(relay=\S+).*?(status=(?:sent|bounced|deferred) \([^)]{0,100})', log) if q else []
            print(mid, *(final[-1] if final else ['PENDING']))
        PY
      register: outbound
      retries: 20
      delay: 6
      until: "'PENDING' not in outbound.stdout and 'status=deferred' not in outbound.stdout"
      failed_when: "outbound.stdout_lines | length < 2 or (outbound.stdout_lines | reject('search', 'status=sent') | list | length) > 0"
      changed_when: false

    - name: Wait for the port25 authentication report in the inbox
      shell: |
        python3 - <<'PY'
        import mailbox, re, sys
        token = re.search(r'token=(\S+)', '''{{ sent.stdout }}''').group(1)
        for msg in mailbox.mbox('/var/mail/inbox'):
            payload = msg.get_payload(decode=False)
            text = payload if isinstance(payload, str) else ''.join(p.as_string() for p in payload)
            if token in text and 'Summary of Results' in text:
                for line in text.splitlines():
                    if re.match(r'^(SPF|DomainKeys|DKIM|DMARC|iprev|SpamAssassin)\s+check:', line.strip()):
                        print(line.strip())
                sys.exit(0)
        sys.exit(1)
        PY
      register: auth_report
      retries: 30
      delay: 10
      until: auth_report.rc == 0
      changed_when: false

    - name: SPF, DKIM and DMARC pass at the external verifier
      assert:
        that:
          - "'SPF check:          pass' in auth_report.stdout or auth_report.stdout is search('SPF check:\\s+pass')"
          - "auth_report.stdout is search('DKIM check:\\s+pass')"
          - "auth_report.stdout is search('DMARC check:\\s+pass') or 'DMARC' not in auth_report.stdout"
        fail_msg: "{{ auth_report.stdout_lines | to_json }}"

    - name: Summary
      debug:
        msg:
          - "DNS: {{ dns_map }}"
          - "STARTTLS: {{ starttls.stdout_lines }}"
          - "Open relay refused: {{ relay.rc == 0 }}"
          - "Inbound hello@ delivered locally: {{ inbound.stdout }} message(s)"
          - "Outbound: {{ outbound.stdout_lines }}"
          - "External verifier: {{ auth_report.stdout_lines }}"
          - "Read the inbox: sudo mail -f /var/mail/inbox   (DMARC reports: /var/mail/dmarc)"
