---
# Iguana Comedy on a single VPS: Astro (Node) on :3000, Django (gunicorn) on :8001, Postgres, nginx, supervisor.
#
# First time (after disableroot.yml):
#   ansible-playbook deploy.yml --tags all,first_run,load_data
# Code/content update:
#   ansible-playbook deploy.yml
# New certificates (site, api, mail):
#   ansible-playbook deploy.yml --tags all,certs
# Mail only / mail health check:
#   ansible-playbook mail.yml    ansible-playbook email_check.yml
#
# Code is rsynced from this checkout (not git-pulled) until the repo destination is decided.

- hosts: web
  vars:
    repo_root: "{{ playbook_dir }}/.."
    fixture_local: "{{ playbook_dir }}/../backend/local_data.json"
  tasks:
    # ---------------------------------------------------------------- system
    - name: Install system packages
      become: true
      apt:
        update_cache: true
        cache_valid_time: 3600
        pkg: [git, rsync, acl, curl, ca-certificates, gnupg, htop, build-essential, python3-venv, python3-dev,
               python3-psycopg2, libpq-dev, postgresql, postgresql-contrib, nginx, supervisor, certbot, ufw]
      tags: [first_run]

    - name: Add NodeSource key
      become: true
      shell: curl -fsSL https://deb.nodesource.com/gpgkey/nodesource-repo.gpg.key | gpg --dearmor -o /etc/apt/keyrings/nodesource.gpg
      args: {creates: /etc/apt/keyrings/nodesource.gpg}
      tags: [first_run]

    - name: Add NodeSource Node 20 repo
      become: true
      copy:
        dest: /etc/apt/sources.list.d/nodesource.list
        content: "deb [signed-by=/etc/apt/keyrings/nodesource.gpg] https://deb.nodesource.com/node_20.x nodistro main\n"
      tags: [first_run]

    - name: Install Node.js 20
      become: true
      apt: {name: nodejs, update_cache: true, state: present}
      tags: [first_run]

    - name: Create 2G swap file
      become: true
      shell: |
        fallocate -l 2G /swapfile && chmod 600 /swapfile && mkswap /swapfile && swapon /swapfile
        echo '/swapfile none swap sw 0 0' >> /etc/fstab
      args: {creates: /swapfile}
      tags: [first_run]

    - name: Firewall rules
      become: true
      ufw: {rule: allow, port: "{{ item }}", proto: tcp}
      loop: ["22", "25", "80", "443"]
      tags: [first_run]

    - name: Temporary API port until DNS is live
      become: true
      ufw: {rule: allow, port: "8080", proto: tcp, delete: "{{ dns_live | bool }}"}

    - name: Enable firewall
      become: true
      ufw: {state: enabled, policy: deny}
      tags: [first_run]

    # -------------------------------------------------------------- database
    - name: Postgres user
      become: true
      become_user: postgres
      community.postgresql.postgresql_user: {name: "{{ db_user }}", password: "{{ db_password }}"}
      tags: [first_run]

    - name: Postgres database
      become: true
      become_user: postgres
      community.postgresql.postgresql_db: {name: "{{ db_name }}", owner: "{{ db_user }}"}
      tags: [first_run]

    # ------------------------------------------------------------------ code
    - name: App directories
      become: true
      file: {path: "{{ item }}", state: directory, owner: "{{ deploy_user }}", group: "{{ deploy_user }}", mode: "0755"}
      loop: ["/home/www", "{{ app_dir }}", "/var/log/{{ projectname }}", "/var/www/letsencrypt"]

    - name: Sync code and archive media
      ansible.posix.synchronize:
        src: "{{ repo_root }}/"
        dest: "{{ app_dir }}/"
        delete: true
        rsync_opts:
          - "--exclude=.git/"
          - "--exclude=node_modules/"
          - "--exclude=dist/"
          - "--exclude=.astro/"
          - "--exclude=.env"
          - "--exclude=.dev.vars"
          - "--exclude=ansible/"
          - "--exclude=backend/.venv/"
          - "--exclude=backend/venv/"
          - "--exclude=backend/config.py"
          - "--exclude=backend/db.sqlite3"
          - "--exclude=backend/staticfiles/"
          - "--exclude=backend/local_data.json"
          - "--exclude=__pycache__/"
          - "--exclude=.wrangler/"
          - "--exclude=backend/media/"

    - name: Sync media without deleting (admin uploads live only on the server)
      ansible.posix.synchronize:
        src: "{{ repo_root }}/backend/media/"
        dest: "{{ app_dir }}/backend/media/"
        delete: false

    - name: Site env (.env)
      template: {src: files/env.j2, dest: "{{ app_dir }}/.env", mode: "0600"}
      register: site_env

    - name: Backend config.py
      template: {src: files/config.py.j2, dest: "{{ app_dir }}/backend/config.py", mode: "0600"}

    # --------------------------------------------------------------- backend
    - name: Backend virtualenv and requirements
      pip:
        requirements: "{{ app_dir }}/backend/requirements.txt"
        virtualenv: "{{ app_dir }}/backend/venv"
        virtualenv_command: python3 -m venv

    - name: Migrate
      command: venv/bin/python manage.py migrate --noinput
      args: {chdir: "{{ app_dir }}/backend"}
      register: migrate
      changed_when: "'No migrations to apply' not in migrate.stdout"

    - name: Collect static
      command: venv/bin/python manage.py collectstatic --noinput
      args: {chdir: "{{ app_dir }}/backend"}
      changed_when: false

    - name: Load data fixture (contains customer data; always removed afterwards)
      tags: [load_data, never]
      block:
        - name: Upload data fixture
          copy: {src: "{{ fixture_local }}", dest: "{{ app_dir }}/backend/local_data.json", mode: "0600"}
        - name: Load data
          command: venv/bin/python manage.py loaddata local_data.json
          args: {chdir: "{{ app_dir }}/backend"}
      always:
        - name: Remove data fixture
          file: {path: "{{ app_dir }}/backend/local_data.json", state: absent}

    - name: Seed site defaults
      command: venv/bin/python manage.py seed_site_defaults
      args: {chdir: "{{ app_dir }}/backend"}
      changed_when: false

    - name: Admin user
      command: venv/bin/python manage.py shell -c "{{ admin_script }}"
      args: {chdir: "{{ app_dir }}/backend"}
      vars:
        admin_script: >-
          from django.contrib.auth.models import User;
          u = User.objects.filter(username='admin').first() or User(username='admin', email='hello@iguanacomedy.com');
          u.is_staff = u.is_superuser = True;
          u.set_password('''{{ lookup('file', creds + '/admin_password') }}''') if not u.pk else None;
          u.save()
      no_log: true
      tags: [first_run]

    # ------------------------------------------------------------------ site
    - name: npm ci
      command: npm ci --no-audit --no-fund
      args: {chdir: "{{ app_dir }}"}
      changed_when: false

    - name: Build site (Node adapter)
      command: npm run build:node
      args: {chdir: "{{ app_dir }}"}
      environment: {NODE_OPTIONS: "--max-old-space-size=1536"}
      changed_when: true

    # ----------------------------------------------------------- nginx/procs
    - name: nginx
      include_tasks: tasks/nginx.yml

    - name: Supervisor programs
      become: true
      template: {src: files/supervisor.conf.j2, dest: "/etc/supervisor/conf.d/{{ projectname }}.conf", mode: "0644"}

    - name: Supervisor update
      become: true
      command: supervisorctl update
      changed_when: false

    - name: Restart app
      become: true
      command: "supervisorctl restart {{ projectname }}:"
      changed_when: true

    # ----------------------------------------------------------------- certs
    - name: Obtain certificates (needs DNS pointing here)
      become: true
      command: >-
        certbot certonly --webroot -w /var/www/letsencrypt -n --agree-tos -m {{ certbot_email }}
        --cert-name {{ item.name }} {{ item.domains | map('regex_replace', '^', '-d ') | join(' ') }}
      args: {creates: "/etc/letsencrypt/live/{{ item.name }}/fullchain.pem"}
      loop: "{{ cert_sets }}"
      when: dns_live | bool
      register: new_certs
      tags: [certs, never]

    - name: Re-render nginx with the new certificates
      include_tasks: tasks/nginx.yml
      when: new_certs is changed
      tags: [certs, never]

    - name: Reload nginx after certificate renewals
      become: true
      copy:
        dest: /etc/letsencrypt/renewal-hooks/deploy/reload-nginx.sh
        content: "#!/bin/sh\nsystemctl reload nginx\nsystemctl reload postfix\n"
        mode: "0755"
      tags: [certs, never]

    - name: Wait for the site
      uri: {url: "http://127.0.0.1:3000/en/", status_code: 200}
      register: health
      retries: 10
      delay: 3
      until: health.status == 200

- import_playbook: mail.yml
